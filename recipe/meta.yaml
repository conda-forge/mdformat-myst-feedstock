{% set name = "mdformat-myst" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/mdformat_myst-{{ version }}.tar.gz
  sha256: 8195dec075683cac689c5586a5e4c6700ec8d6df0f9bc34a1e2f3514d5e745b0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - flit-core >=2,<4
    - pip
  run:
    - python >={{ python_min }}
    - mdformat >=0.7.0
    - mdit-py-plugins >=0.3.0
    - mdformat-front-matters >=1.0.0
    - mdformat-footnote >=0.1.1
    - mdformat-gfm >=1.0.0
    - ruamel.yaml >=0.16.0

test:
  imports:
    - mdformat_myst
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/hukkinj1/mdformat-myst
  summary: Mdformat plugin for MyST compatibility.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - xylar
